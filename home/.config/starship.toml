# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 200
format = "[$directory$git_branch]($style)$character"

[character]
# Ember Hollow (Rex theme) green, yellow, accent orange.
error_symbol = "[✗](bold #e06c4f)"
success_symbol = "[❯](bold #a3b06a)[❯](bold #e8a75a)[❯](bold #f0955c)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "bold"
